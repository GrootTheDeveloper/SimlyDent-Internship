# Deploy LiveKit 1:1 PoC to the public VPS when the PoC tree changes.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST          e.g. 103.28.32.118
#   VPS_USER          e.g. root
#   VPS_SSH_KEY_B64   base64 of private key (one line — preferred, hard to break)
#   VPS_SSH_KEY       OR raw private key (multiline). Used only if B64 empty.
#
name: Deploy LiveKit VPS

on:
  push:
    branches: [main]
    paths:
      - "internship-log/work/TASK-002-web-video-call/poc/livekit-1to1/**"
      - ".github/workflows/deploy-livekit-vps.yml"
  workflow_dispatch:

concurrency:
  group: deploy-livekit-vps
  cancel-in-progress: true

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare SSH private key
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          KEY="${{ runner.temp }}/simlydent_vps_deploy"
          if [ -n "${VPS_SSH_KEY_B64:-}" ]; then
            echo "Using VPS_SSH_KEY_B64"
            echo "$VPS_SSH_KEY_B64" | base64 -d > "$KEY"
          elif [ -n "${VPS_SSH_KEY:-}" ]; then
            echo "Using VPS_SSH_KEY (raw)"
            # Support secrets pasted with literal \n sequences
            printf '%s\n' "$VPS_SSH_KEY" | sed 's/\r$//' | sed 's/\\n/\n/g' > "$KEY"
          else
            echo "Missing secrets: set VPS_SSH_KEY_B64 (preferred) or VPS_SSH_KEY"
            exit 1
          fi
          chmod 600 "$KEY"
          # Fail fast if secret is truncated / public key / wrong paste
          ssh-keygen -y -f "$KEY" >/dev/null
          echo "SSH private key OK → $KEY"
          echo "KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: ${{ env.KEY_PATH }}
          port: 22
          command_timeout: 25m
          request_pty: true
          envs: GITHUB_SHA
          script: |
            set -euo pipefail
            REPO_DIR="/opt/SimlyDent-Internship"
            APP_DIR="$REPO_DIR/internship-log/work/TASK-002-web-video-call/poc/livekit-1to1"

            echo "==> Deploy commit ${GITHUB_SHA:-unknown}"
            echo "==> Repo: $REPO_DIR"
            echo "==> App:  $APP_DIR"

            test -d "$REPO_DIR/.git"
            test -d "$APP_DIR"
            test -f "$APP_DIR/.env"

            cd "$REPO_DIR"
            git remote -v
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git log -1 --oneline

            cd "$APP_DIR"
            test -f .env
            chmod +x scripts/start-vps.sh
            ./scripts/start-vps.sh

            docker compose -f docker-compose.vps.yml ps

            set -a
            # shellcheck disable=SC1091
            source .env
            set +a
            echo "==> Smoke https://${DOMAIN}/api/identities"
            curl -fsS --retry 8 --retry-delay 3 "https://${DOMAIN}/api/identities" | head -c 500
            echo
            echo "==> Deploy OK"
