# Deploy LiveKit 1:1 PoC to the public VPS when the PoC tree changes.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST          e.g. 103.28.32.118
#   VPS_USER          e.g. root
#   VPS_SSH_KEY_B64   base64 of private key (one line — preferred, hard to break)
#   VPS_SSH_KEY       OR raw private key (multiline). Used only if B64 empty.
#
name: Deploy LiveKit VPS

on:
  push:
    branches: [main]
    paths:
      - "internship-log/work/TASK-002-web-video-call/poc/livekit-1to1/**"
      - ".github/workflows/deploy-livekit-vps.yml"
  workflow_dispatch:

concurrency:
  group: deploy-livekit-vps
  cancel-in-progress: true

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare SSH private key
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          KEY="${{ runner.temp }}/simlydent_vps_deploy"
          B64="$(printf '%s' "${VPS_SSH_KEY_B64:-}" | tr -d '[:space:]')"
          RAW="${VPS_SSH_KEY:-}"

          write_raw_key() {
            # Normalize Windows CRLF and literal \n from botched pastes
            printf '%s\n' "$1" | sed 's/\r$//' | sed 's/\\n/\n/g' > "$KEY"
          }

          if [ -n "$B64" ]; then
            echo "Using VPS_SSH_KEY_B64 (len=${#B64})"
            # Reject accidental paste of private key PEM into the B64 secret
            if printf '%s' "$B64" | grep -q 'BEGIN'; then
              echo "ERROR: VPS_SSH_KEY_B64 looks like PEM text, not base64. Use base64 only."
              exit 1
            fi
            printf '%s' "$B64" | base64 -d > "$KEY"
          elif [ -n "$RAW" ]; then
            # Auto-detect: user often pastes base64 into VPS_SSH_KEY by mistake
            TRIMMED="$(printf '%s' "$RAW" | tr -d '[:space:]')"
            if printf '%s' "$RAW" | grep -q 'BEGIN .*PRIVATE KEY'; then
              echo "Using VPS_SSH_KEY as PEM/OpenSSH private key"
              write_raw_key "$RAW"
            elif printf '%s' "$TRIMMED" | grep -Eq '^[A-Za-z0-9+/]+=*$' && [ "${#TRIMMED}" -gt 80 ]; then
              echo "Using VPS_SSH_KEY as base64 (auto-detect)"
              printf '%s' "$TRIMMED" | base64 -d > "$KEY"
            elif printf '%s' "$RAW" | grep -q 'BEGIN'; then
              echo "Using VPS_SSH_KEY as PEM-like text"
              write_raw_key "$RAW"
            else
              echo "ERROR: VPS_SSH_KEY is set but not a valid private key or base64."
              echo "Create secret VPS_SSH_KEY_B64 = one-line base64 of the private key file."
              echo "PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes(\"$env:USERPROFILE\\.ssh\\simlydent_vps_deploy\"))"
              exit 1
            fi
          else
            echo "ERROR: Missing secrets."
            echo "Set VPS_SSH_KEY_B64 (preferred) OR VPS_SSH_KEY."
            echo "Also need VPS_HOST and VPS_USER."
            exit 1
          fi

          chmod 600 "$KEY"
          BYTES=$(wc -c < "$KEY" | tr -d ' ')
          echo "Key file bytes=$BYTES"
          # Head marker only (safe) — never print key body
          head -n1 "$KEY" || true
          if ! ssh-keygen -y -f "$KEY" >/dev/null 2>keyerr.txt; then
            echo "ERROR: ssh-keygen cannot load key (libcrypto / corrupt secret)."
            echo "Typical causes: truncated paste, public key (.pub) pasted, wrong secret name."
            cat keyerr.txt || true
            exit 1
          fi
          echo "SSH private key OK → $KEY"
          echo "KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: ${{ env.KEY_PATH }}
          port: 22
          command_timeout: 25m
          request_pty: true
          envs: GITHUB_SHA
          script: |
            set -euo pipefail
            REPO_DIR="/opt/SimlyDent-Internship"
            APP_DIR="$REPO_DIR/internship-log/work/TASK-002-web-video-call/poc/livekit-1to1"

            echo "==> Deploy commit ${GITHUB_SHA:-unknown}"
            echo "==> Repo: $REPO_DIR"
            echo "==> App:  $APP_DIR"

            test -d "$REPO_DIR/.git"
            test -d "$APP_DIR"
            test -f "$APP_DIR/.env"

            cd "$REPO_DIR"
            git remote -v
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git log -1 --oneline

            cd "$APP_DIR"
            test -f .env
            chmod +x scripts/start-vps.sh
            ./scripts/start-vps.sh

            docker compose -f docker-compose.vps.yml ps

            set -a
            # shellcheck disable=SC1091
            source .env
            set +a
            echo "==> Smoke https://${DOMAIN}/api/identities"
            curl -fsS --retry 8 --retry-delay 3 "https://${DOMAIN}/api/identities" | head -c 500
            echo
            echo "==> Deploy OK"
