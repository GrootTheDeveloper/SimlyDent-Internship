services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13.1
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LAN_IP:-127.0.0.1}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env or run scripts/start.ps1}"
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
    depends_on:
      - redis
    restart: unless-stopped

  egress:
    image: livekit/egress:v1.12.0
    cap_add:
      - SYS_ADMIN
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env or run scripts/start.ps1}
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./infra/egress.yaml:/etc/egress.yaml:ro
      - ./recordings:/out
    depends_on:
      - redis
      - livekit
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      ASPNETCORE_URLS: http://+:8080
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env or run scripts/start.ps1}
      LIVEKIT_HTTP_URL: http://livekit:7880
      RECORDINGS_PATH: /recordings
      QUALITY_LOGS_PATH: /telemetry
    volumes:
      - ./recordings:/recordings:ro
      - ./telemetry:/telemetry
    ports:
      - "5080:8080"
    depends_on:
      - livekit
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  gateway:
    image: caddy:2.11.4-alpine
    environment:
      LAN_IP: ${LAN_IP:?Set LAN_IP in .env or run scripts/start.ps1}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "8443:8443"
      - "8088:8088"
    depends_on:
      - livekit
      - backend
      - frontend
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    command: ["tunnel", "--no-autoupdate", "--url", "http://frontend:80"]
    profiles: ["share"]
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
