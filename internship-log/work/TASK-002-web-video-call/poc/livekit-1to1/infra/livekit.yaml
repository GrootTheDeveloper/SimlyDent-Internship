port: 7880
bind_addresses:
  - "0.0.0.0"
redis:
  address: redis:6379
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50020
  use_external_ip: false
room:
  empty_timeout: 300
  departure_timeout: 20
logging:
  level: info
# Capacity / media-load tests scrape http://localhost:6789/metrics
prometheus_port: 6789
# Recording finalize (R-egress-finalize): egress_ended → ASP.NET
webhook:
  api_key: devkey
  urls:
    - http://backend:8080/api/livekit/webhook
