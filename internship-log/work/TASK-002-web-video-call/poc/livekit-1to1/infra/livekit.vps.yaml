# LiveKit config for public VPS (different networks).
# start-vps.sh / start-vps.ps1 rewrites TURN_DOMAIN_PLACEHOLDER before start.
port: 7880
bind_addresses:
  - "0.0.0.0"
redis:
  address: redis:6379
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50050
  # PUBLIC_IP is passed as --node-ip in docker-compose.vps.yml.
  # Do not use STUN URIs with "stun:" scheme here — LiveKit dials host:port only.
  use_external_ip: false
  stun_servers:
    - stun.l.google.com:19302
    - stun1.l.google.com:19302
# Embedded TURN for clients behind strict NAT (different home/office networks).
turn:
  enabled: true
  domain: TURN_DOMAIN_PLACEHOLDER
  udp_port: 3478
room:
  empty_timeout: 300
  departure_timeout: 20
logging:
  level: info
# Scrape from host/ops only; do not expose 6789 on public firewall unless locked down.
prometheus_port: 6789
