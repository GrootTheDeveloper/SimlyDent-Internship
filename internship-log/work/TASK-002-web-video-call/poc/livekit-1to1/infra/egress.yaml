log_level: info
ws_url: ws://livekit:7880
insecure: true
redis:
  address: redis:6379
backup_storage: /out
health_port: 8080
prometheus_port: 9090

# VPS lab has 2 vCPU. Default room_composite cost is 4, so Egress never
# accepts StartRoomCompositeEgress ("no response from servers" / 503).
# Override for PoC only — real load may stutter; prefer 4+ CPU for production.
cpu_cost:
  room_composite_cpu_cost: 1.5
  web_cpu_cost: 1.5
  track_composite_cpu_cost: 1.0
  track_cpu_cost: 0.5
