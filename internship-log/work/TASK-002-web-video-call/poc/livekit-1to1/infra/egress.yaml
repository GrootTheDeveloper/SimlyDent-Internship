log_level: info
ws_url: ws://livekit:7880
insecure: true
redis:
  address: redis:6379
backup_storage: /out
health_port: 8080
prometheus_port: 9090

# VPS lab ~2 vCPU. Defaults (room_composite=4) reject 2nd job:
# "twirp error unknown: no response from servers".
# Allow concurrent auto-audio + manual video (and dental track) for PoC.
cpu_cost:
  room_composite_cpu_cost: 0.8
  web_cpu_cost: 0.8
  track_composite_cpu_cost: 0.5
  track_cpu_cost: 0.3
