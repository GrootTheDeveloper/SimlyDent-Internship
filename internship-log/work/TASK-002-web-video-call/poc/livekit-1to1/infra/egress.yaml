log_level: info
ws_url: ws://livekit:7880
insecure: true
redis:
  address: redis:6379
backup_storage: /out
health_port: 8080
prometheus_port: 9090

# Lab 2 vCPU: measured load often leaves <1 free CPU unit.
# Concurrent auto-audio + video room composite → "no response from servers".
cpu_cost:
  room_composite_cpu_cost: 0.3
  web_cpu_cost: 0.3
  track_composite_cpu_cost: 0.25
  track_cpu_cost: 0.15
