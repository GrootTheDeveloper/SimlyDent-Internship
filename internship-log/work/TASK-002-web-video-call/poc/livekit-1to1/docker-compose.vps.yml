# VPS / multi-network deployment.
# Usage on the server:
#   cp .env.vps.example .env
#   # edit DOMAIN, PUBLIC_IP, secrets
#   docker compose -f docker-compose.vps.yml up -d --build
#
# Required open ports on the VPS firewall / security group:
#   80/tcp, 443/tcp          UI + API + LiveKit signaling (HTTPS)
#   7881/tcp                 WebRTC TCP fallback
#   3478/tcp+udp             TURN
#   5349/tcp+udp             TURN TLS
#   50000-50050/udp          WebRTC media

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  # Durable recording catalog (R-pg-core).
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simlydent}
      POSTGRES_USER: ${POSTGRES_USER:-simlydent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simlydent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simlydent} -d ${POSTGRES_DB:-simlydent}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13.1
    command:
      - --config
      - /etc/livekit.yaml
      - --node-ip
      - ${PUBLIC_IP:?Set PUBLIC_IP to the VPS public IPv4}
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}"
    volumes:
      # Generated by scripts/start-vps.sh|ps1 from livekit.vps.yaml
      - ./infra/livekit.vps.runtime.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881"
      - "3478:3478"
      - "3478:3478/udp"
      - "50000-50050:50000-50050/udp"
    depends_on:
      - redis
    restart: unless-stopped

  egress:
    image: livekit/egress:v1.12.0
    cap_add:
      - SYS_ADMIN
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./infra/egress.yaml:/etc/egress.yaml:ro
      - ./recordings:/out
    depends_on:
      - redis
      - livekit
    restart: unless-stopped
    profiles: ["recording"]

  backend:
    build:
      context: ./backend
    environment:
      ASPNETCORE_URLS: http://+:8080
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}
      LIVEKIT_HTTP_URL: http://livekit:7880
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET for VPS}
      EMBED_JWT_SECRET: ${EMBED_JWT_SECRET:?Set EMBED_JWT_SECRET for VPS}
      EMBED_JWT_LIFETIME_MINUTES: ${EMBED_JWT_LIFETIME_MINUTES:-120}
      EMBED_RATE_LIMIT_PER_MINUTE: ${EMBED_RATE_LIMIT_PER_MINUTE:-30}
      EMBED_VISITOR_STALE_WAITING_SECONDS: ${EMBED_VISITOR_STALE_WAITING_SECONDS:-30}
      EMBED_VISITOR_STALE_INCALL_SECONDS: ${EMBED_VISITOR_STALE_INCALL_SECONDS:-90}
      EMBED_ORIGINS_CLINIC_A: ${EMBED_ORIGINS_CLINIC_A:-}
      EMBED_ORIGINS_CLINIC_B: ${EMBED_ORIGINS_CLINIC_B:-}
      EMBED_PUBLIC_ORIGIN: ${EMBED_PUBLIC_ORIGIN:-}
      REQUIRE_STRICT_SECRETS: ${REQUIRE_STRICT_SECRETS:-1}
      JWT_LIFETIME_MINUTES: ${JWT_LIFETIME_MINUTES:-480}
      RECORDINGS_PATH: /recordings
      QUALITY_LOGS_PATH: /telemetry
      RECORDING_STORAGE: ${RECORDING_STORAGE:-local}
      # local = egress /out + API archive; s3 = Egress direct upload (needs minio + RECORDING_STORAGE=s3)
      EGRESS_OUTPUT: ${EGRESS_OUTPUT:-local}
      RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-30}
      RECORDING_CATALOG: ${RECORDING_CATALOG:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-simlydent}
      POSTGRES_USER: ${POSTGRES_USER:-simlydent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simlydent}
      # Encode: preset (default) or advanced custom bitrate. See docs/egress-encode-profiles.md
      EGRESS_ENCODING_MODE: ${EGRESS_ENCODING_MODE:-preset}
      EGRESS_VIDEO_PRESET: ${EGRESS_VIDEO_PRESET:-H264_720P_30}
      EGRESS_WIDTH: ${EGRESS_WIDTH:-1280}
      EGRESS_HEIGHT: ${EGRESS_HEIGHT:-720}
      EGRESS_FRAMERATE: ${EGRESS_FRAMERATE:-20}
      EGRESS_VIDEO_BITRATE_KBPS: ${EGRESS_VIDEO_BITRATE_KBPS:-1500}
      EGRESS_AUDIO_BITRATE_KBPS: ${EGRESS_AUDIO_BITRATE_KBPS:-96}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-simlydent-recordings}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - ./recordings:/recordings
      - ./telemetry:/telemetry
    depends_on:
      livekit:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    profiles: ["minio"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin via Caddy — leave empty so browser uses https://DOMAIN
        VITE_API_URL: ""
    depends_on:
      - backend
    restart: unless-stopped

  gateway:
    image: caddy:2.11.4-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN e.g. call.example.com}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./infra/Caddyfile.vps:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - livekit
      - backend
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  minio_data:
  postgres_data:
